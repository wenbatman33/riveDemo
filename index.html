<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Motion Library · Rive 互動範例</title>
<link rel="stylesheet" href="./app/styles.css?v=promo-sharp-3">
</head>
<body><main>
<div class="masthead"><span class="brand">MOTION / LIBRARY</span><a class="small" href="#game-icons">遊戲大廳 ↗</a></div>
<header class="intro"><div><h1 id="title">互動範例</h1><p id="description">選一個作品，讓畫面動起來。</p></div><span class="count" id="count"></span></header>
<section class="viewer" id="viewer" aria-label="動畫展示"><div class="load" id="loading" role="status">正在準備動畫…</div></section>
<div class="controls"><button id="toggle" disabled>暫停</button><button id="restart" disabled>重新播放</button><select id="motion" aria-label="播放內容" disabled></select><a id="download" download>下載 .riv</a><a id="editable" download hidden>可編輯 .rev</a><span id="status" role="status">載入中</span></div>
<div id="banner-controls" class="controls" hidden></div><p id="note"></p>
<section class="library"><div class="library-head"><h2>探索範例 / EXPLORE</h2><div class="arrows"><button id="prev" aria-label="上一個範例">←</button><button id="next" aria-label="下一個範例">→</button></div></div><div id="tabs" class="tabs" role="tablist" aria-label="選擇範例"></div></section>
<footer><span>每個作品，都有自己的節奏。</span><a href="https://rive.app/marketplace/23461-43911-journey/" target="_blank" rel="noopener">切換互動參考：Journey / irmate210</a><a href="https://rive.app/marketplace/16547-31173-mummy/" target="_blank" rel="noopener">角色動作原作：Mummy / ersanakpinarr · CC BY 4.0</a></footer>

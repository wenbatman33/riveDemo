<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Motion Library · Rive 互動範例</title>
<style>
[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;background:#101214;color:#f2efe9;font:15px/1.5 system-ui,-apple-system,sans-serif}button,a,select{-webkit-tap-highlight-color:transparent}button,select{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer}a{color:inherit}button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid #f6c884;outline-offset:5px}main{max-width:1400px;margin:auto;padding:24px 40px}.masthead{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ffffff1c;padding-bottom:20px}.brand{font-size:12px;letter-spacing:.22em}.small{color:#969c9e;font-size:12px}.intro{display:flex;align-items:end;justify-content:space-between;padding:24px 0 18px;gap:20px}h1{font-size:clamp(28px,4vw,46px);font-weight:500;letter-spacing:-.04em;line-height:1.15;margin:0}.intro p{margin:8px 0 0;color:#9da2a3;font-size:14px}.count{font:14px ui-monospace,monospace;color:#b8bcbc;white-space:nowrap}.viewer{position:relative;background:#191c20;border:1px solid #ffffff15;border-radius:22px;overflow:hidden;height:clamp(290px,55svh,650px);transition:background .5s}.viewer[data-theme=school]{background:#e9d8bf}.viewer canvas{width:100%;height:100%;display:block;animation:arrive .55s cubic-bezier(.2,.7,.2,1)}@keyframes arrive{from{opacity:0;transform:translateX(28px) scale(.98)}to{opacity:1;transform:none}}.load{position:absolute;inset:0;display:grid;place-content:center;background:#191c20;color:#c2c7c7}.load[hidden]{display:none}.controls{display:flex;align-items:center;gap:10px;padding:16px 0;flex-wrap:wrap}.controls button,.controls select,.controls a{border:1px solid #ffffff25;color:#dedfdb;background:#1c2024;border-radius:24px;padding:8px 15px;text-decoration:none;font-size:13px}.controls select{max-width:230px}.controls button:disabled{opacity:.35;cursor:wait}#status{margin-left:auto;color:#9ca7a6;font-size:12px}.library{border-top:1px solid #ffffff1c;padding-top:18px}.library-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.library-head h2{margin:0;font-size:12px;font-weight:500;letter-spacing:.12em;color:#9da3a5}.arrows{display:flex;gap:8px}.arrows button{background:transparent;border:1px solid #ffffff28;border-radius:50%;width:32px;height:32px;color:#d2d5d2}.tabs{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:3px 3px 12px}.card{flex:0 0 260px;text-align:left;position:relative;background:#1a1e21;color:#d6dad7;border:1px solid #ffffff15;border-radius:14px;padding:16px 18px;scroll-snap-align:start;transition:background .2s,transform .2s,border-color .2s}.card:hover{background:#252b2d;transform:translateY(-2px)}.card[aria-selected=true]{border-color:#ebc38a;background:#302d27;color:#fff4df}.card .num{display:block;font:10px ui-monospace,monospace;color:#a69e8c;margin-bottom:8px;letter-spacing:.14em}.card strong{font-size:18px;font-weight:500;display:block}.card .desc{font-size:12px;color:#a9afaa;display:block;margin-top:5px}.card[aria-selected=true]:after{content:'目前範例';position:absolute;right:16px;top:16px;font-size:10px;color:#ebc38a}footer{display:flex;justify-content:space-between;gap:16px;color:#737c80;font-size:11px;padding:8px 0 12px}footer a{text-underline-offset:3px}#note{color:#898f8e;font-size:12px;margin:0 0 14px}@media(max-width:600px){main{padding:18px 16px}.masthead{padding-bottom:15px}.brand{font-size:10px}.intro{padding:20px 0 16px}.intro p{font-size:12px;max-width:240px}.viewer{height:45svh;min-height:290px;border-radius:16px}.controls{gap:8px}.controls button,.controls select,.controls a{font-size:12px;padding:8px 12px}#status{width:100%;margin:0}.card{flex-basis:220px}footer{flex-wrap:wrap}.small{font-size:10px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body><main>
<div class="masthead"><span class="brand">MOTION / LIBRARY</span><span class="small">RIVE 互動作品集</span></div>
<header class="intro"><div><h1 id="title">互動範例</h1><p id="description">選一個作品，讓畫面動起來。</p></div><span class="count" id="count"></span></header>
<section class="viewer" id="viewer" aria-label="動畫展示"><div class="load" id="loading" role="status">正在準備動畫…</div></section>
<div class="controls"><button id="toggle" disabled>暫停</button><button id="restart" disabled>重新播放</button><select id="motion" aria-label="播放內容" disabled></select><a id="detail" href="./fighter.html">完整範例 ↗</a><span id="status" role="status">載入中</span></div>
<div id="banner-controls" class="controls" hidden><button data-screen="2">進入選單</button><button data-screen="1">返回首頁</button><button data-trigger="tapBear">熊跳</button><button data-trigger="tapChick">小雞跳</button><button data-trigger="tapFrog">青蛙跳</button></div><p id="note"></p>
<section class="library"><div class="library-head"><h2>探索範例 / EXPLORE</h2><div class="arrows"><button id="prev" aria-label="上一個範例">←</button><button id="next" aria-label="下一個範例">→</button></div></div><div id="tabs" class="tabs" role="tablist" aria-label="選擇範例"></div></section>
<footer><span>每個作品，都有自己的節奏。</span><a href="https://rive.app/marketplace/23461-43911-journey/" target="_blank" rel="noopener">切換互動參考：Journey / irmate210</a><a href="https://rive.app/marketplace/16547-31173-mummy/" target="_blank" rel="noopener">角色動作原作：Mummy / ersanakpinarr · CC BY 4.0</a></footer>
</main><script src="./vendor/rive.js"></script><script>
// 新範例只需加到此清單；首頁選單、編號與切換會自動建立。
const demos=[
 {id:'fighter',title:'Red Fighter',description:'呼吸、轉身，與隨風擺動的頭巾。',short:'角色待機 · 骨骼動畫',src:'./red_fighter_-_skeletal_breathing.riv',detail:'./fighter.html',theme:'fighter',note:'格鬥角色的待機動作研究。'},
 {id:'school-run',title:'放學以後',description:'背起書包，沿著夕陽下的街道奔跑。',short:'街頭跑步 · 場景循環',src:'./school-run/school-run-reference-quick.riv',detail:'./school-run/?version=trial',theme:'school',note:'目前為節奏試版，骨盆獨立變形仍待調整。',choices:[{name:'State Machine 1',type:'state',label:'街頭跑步'},{name:'Timeline 1',type:'animation',label:'原地跑姿'}]} ,
 {id:'mummy',title:'鷹隼守衛',description:'全身換裝，沿用 Mummy 的跑步、跳躍與攻擊動作。',short:'整身換圖 · 動作切換',src:'./mummy/mummy-guardian.riv',artboard:'mummy',detail:'./mummy/',theme:'mummy',note:'角色主體已換裝；畫布左側縮圖保留原範例。原作：ersanakpinarr / Mummy（CC BY 4.0）。',choices:[{name:'Idle',type:'animation',label:'待機'},{name:'Run',type:'animation',label:'跑步'},{name:'Jump',type:'animation',label:'跳躍'},{name:'Attack',type:'animation',label:'攻擊'}]},
 {id:'anime-banner',title:'Neon Anime Girl',description:'霓虹少女的呼吸、眨眼與滑鼠視差互動。',short:'直式 Banner · 滑鼠互動',src:'./banners/anime-girl-ai.riv',detail:'./banners/',theme:'banner',note:'移動滑鼠，觀察角色與背景的視差變化。',autoBind:false,choices:[{name:'State Machine 1',type:'state',label:'互動動畫'}]},
 {id:'kids-banner',title:'PlayPals',description:'繽紛的兒童互動 Banner，點 START 探索角色選單。',short:'橫式 Banner · 點擊互動',src:'./banners/kids-app-ai.riv',detail:'./banners/',theme:'banner',note:'點 START／BACK 切換畫面，點小動物讓牠們跳躍。',autoBind:true,choices:[{name:'State Machine 1',type:'state',label:'互動動畫'}]},


];
if(new URLSearchParams(location.search).has('embedded'))document.querySelector('#detail').style.display='none';
const $=s=>document.querySelector(s),viewer=$('#viewer'),loading=$('#loading'),tabs=$('#tabs'),motion=$('#motion');
let player=null,index=-1,generation=0,playing=false,choices=[],ready=false;
function playback(value){playing=value;$('#toggle').textContent=value?'暫停':'播放';$('#status').textContent=value?'播放中 · Rive':'已暫停';document.body.dataset.playback=value?'playing':'paused';}
function start(){if(!ready)return;const c=choices[Number(motion.value)||0];player.reset({artboard:demos[index].artboard,autoBind:!!demos[index].autoBind,autoplay:true,...(c.type==='state'?{stateMachine:c.name}:{animations:demos[index].id==='mummy'?[c.name,'Staff']:c.name})});player.resizeDrawingSurfaceToCanvas();playback(true);}
function selectDemo(next,updateUrl=true){
 index=(next+demos.length)%demos.length;const d=demos[index],token=++generation;ready=false;$('#banner-controls').hidden=true;
 if(player){player.cleanup();player=null;}viewer.querySelector('canvas')?.remove();
 const canvas=document.createElement('canvas');canvas.setAttribute('aria-label',d.title+' 動畫');viewer.prepend(canvas);viewer.dataset.theme=d.theme;
 loading.hidden=false;loading.textContent='正在準備動畫…';$('#title').textContent=d.title;$('#description').textContent=d.description;$('#note').textContent=d.note||'';$('#detail').href=d.detail;$('#count').textContent=String(index+1).padStart(2,'0')+' / '+String(demos.length).padStart(2,'0');
 document.title=d.title+' · Motion Library';document.body.dataset.demo=d.id;document.body.dataset.loaded='loading';$('#status').textContent='載入中';motion.replaceChildren();[$('#toggle'),$('#restart'),motion].forEach(el=>el.disabled=true);
 [...tabs.children].forEach((el,i)=>{el.setAttribute('aria-selected',String(i===index));el.tabIndex=i===index?0:-1;});
 if(updateUrl)history.replaceState(null,'','#'+d.id);
 if(!window.rive){loading.textContent='無法載入 Rive 播放器。';return;}
 player=new rive.Rive({src:d.src,artboard:d.artboard,autoBind:!!d.autoBind,stateMachine:d.theme==='banner'?'State Machine 1':undefined,canvas,autoplay:d.theme==='banner',layout:new rive.Layout({fit:rive.Fit.Contain,alignment:rive.Alignment.Center}),onLoad(){
  if(token!==generation)return;
  choices=d.choices||[...player.animationNames.map(name=>({name,type:'animation',label:name})),...player.stateMachineNames.map(name=>({name,type:'state',label:name}))];
  if(!choices.length){loading.textContent='此範例沒有可播放的動畫。';return;}
  for(const [i,c]of choices.entries()){const o=document.createElement('option');o.value=i;o.textContent=c.label;motion.append(o);}
  ready=true;$('#banner-controls').hidden=d.id!=='kids-banner';loading.hidden=true;document.body.dataset.loaded='true';[$('#toggle'),$('#restart'),motion].forEach(el=>el.disabled=false);canvas.style.animation='none';void canvas.offsetWidth;canvas.style.animation='';if(d.theme==='banner'){player.resizeDrawingSurfaceToCanvas();playback(true);}else start();
 },onLoadError(){if(token!==generation)return;loading.textContent='動畫載入失敗，請點「完整範例」或重新整理。';document.body.dataset.loaded='error';}});
}
for(const [i,d]of demos.entries()){const b=document.createElement('button');b.className='card';b.role='tab';b.id='tab-'+d.id;const num=document.createElement('span');num.className='num';num.textContent='STUDY '+String(i+1).padStart(2,'0');const title=document.createElement('strong');title.textContent=d.title;const desc=document.createElement('span');desc.className='desc';desc.textContent=d.short;b.append(num,title,desc);b.onclick=()=>selectDemo(i);b.onkeydown=e=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const n=e.key==='Home'?0:e.key==='End'?demos.length-1:index+(e.key==='ArrowRight'?1:-1);selectDemo(n);tabs.children[index].focus();}};tabs.append(b);}
$('#prev').onclick=()=>selectDemo(index-1);$('#next').onclick=()=>selectDemo(index+1);
document.querySelectorAll('[data-screen]').forEach(b=>b.onclick=()=>{if(ready)player.viewModelInstance?.number('screen')&&(player.viewModelInstance.number('screen').value=Number(b.dataset.screen));});
document.querySelectorAll('[data-trigger]').forEach(b=>b.onclick=()=>{if(ready)player.viewModelInstance?.trigger(b.dataset.trigger)?.trigger();});
$('#restart').onclick=start;motion.onchange=start;$('#toggle').onclick=()=>{if(!ready)return;if(playing)player.pause();else player.play();playback(!playing);};
new ResizeObserver(()=>{if(ready)player.resizeDrawingSurfaceToCanvas();}).observe(viewer);
window.addEventListener('pagehide',()=>player?.cleanup(),{once:true});window.addEventListener('hashchange',()=>{const i=demos.findIndex(d=>'#'+d.id===location.hash);if(i>=0&&i!==index)selectDemo(i,false);});
if(window.rive)rive.RuntimeLoader.setWasmUrl('./vendor/rive.wasm');
selectDemo(Math.max(0,demos.findIndex(d=>'#'+d.id===location.hash)),false);
</script></body></html>
